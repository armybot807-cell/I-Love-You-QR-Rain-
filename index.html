<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>I Love You ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}#rain{position:fixed;inset:0;overflow:hidden}.love{position:absolute;top:-12vh;white-space:nowrap;font-weight:700;color:#fff;text-shadow:0 0 8px rgba(255,80,160,.45);animation:fall linear forwards;will-change:transform,opacity}.love span{font-size:1.05em}.love small{font-size:.8em}.glow{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,50,140,.09),transparent 55%);pointer-events:none}.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;animation:pop 1.2s ease-out 1.1s forwards}.center div{font-size:clamp(32px,10vw,72px);font-weight:800;color:white;text-align:center;text-shadow:0 0 16px #ff4b9b,0 0 35px rgba(255,70,160,.7)}@keyframes fall{0%{transform:translate3d(0,-15vh,0) rotate(-2deg);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translate3d(var(--drift),115vh,0) rotate(var(--rot));opacity:.15}}@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1)}}
</style>
</head><body>
<div id="rain"></div><div class="glow"></div><div class="center"><div>I LOVE YOU<br>❤️ 💖 🥰 ✨</div></div>
<script>
const rain=document.getElementById('rain');
const words=['I love you ❤️','I LOVE YOU 💖','I love you 💌','I love you 🥰','I LOVE YOU ❤️✨','I love you 💕','I love you 💗','I LOVE YOU 💞'];
function drop(){
 const e=document.createElement('div'); e.className='love';
 e.innerHTML=words[Math.floor(Math.random()*words.length)];
 const size=15+Math.random()*22;
 e.style.fontSize=size+'px'; e.style.left=(Math.random()*105-5)+'vw';
 e.style.setProperty('--drift',(Math.random()*180-90)+'px');
 e.style.setProperty('--rot',(Math.random()*18-9)+'deg');
 const dur=4.5+Math.random()*4.5; e.style.animationDuration=dur+'s';
 e.style.animationDelay=(Math.random()*1.2)+'s'; rain.appendChild(e);
 setTimeout(()=>e.remove(),(dur+1.5)*1000);
}
for(let i=0;i<42;i++) setTimeout(drop,i*85);
setInterval(drop,125);
</script>
</body></html>
